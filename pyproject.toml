[project]
name = "nsfw-classifier"
version = "0.1.0"
description = "FastAPI service that classifies images as safe or NSFW"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi[standard]>=0.142.2",
    "huggingface-hub>=1.33.0",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "timm>=1.0.30",
    "torch>=2.14.1",
    "transformers>=5.18.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear
    "UP",  # pyupgrade
    "C4",  # comprehensions
    "SIM", # simplify
    "ANN", # annotations
    "RUF", # ruff-specific
]

[tool.pyright]
exclude = ["**/.*", "**/__pycache__", "models", "logs"]
